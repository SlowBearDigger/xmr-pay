name: tests

# Run offline tests and verify the generated widget. Live stagenet tests run separately.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # zero runtime deps + vendored QR encoder; this just validates the lockfile
      - run: npm ci --omit=optional || npm install --omit=optional --no-audit --no-fund
      - run: npm test
      # the widget must be reproducible from source: rebuild and diff
      - run: npm run build && git diff --exit-code widget/xmr-pay.js
